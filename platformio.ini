; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; Srodowisko native istnieje wylacznie dla `pio test -e native`, wiec domyslna
; kompilacja pozostaje firmware.
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
; No OTA and no filesystem in use, so the second app partition and a
; large SPIFFS are wasted space. huge_app.csv gives one 3 MB app partition.
board_build.partitions = huge_app.csv
; Tylko nasze zrodla; biblioteki maja wlasne ostrzezenia.
build_src_flags = -Wall -Wextra
monitor_speed = 9600
lib_deps = 
	adafruit/Adafruit GFX Library@^1.11.11
	adafruit/Adafruit ST7735 and ST7789 Library@^1.10.4
	adafruit/RTClib@^2.1.4
	arduino-libraries/NTPClient@^3.2.1
	bblanchon/ArduinoJson@^7.3.0
	Links2004/WebSockets@^2.3.6

[env:native]
platform = native
test_framework = unity
; Testy wlaczaja potrzebne pliki .cpp bezposrednio, wiec src nie jest budowane.
build_src_filter = -<*>
build_flags =
	-std=gnu++17
	-I src
	-Wall
	-Wextra
	; Unity domyslnie tnie asercje na double.
	-D UNITY_INCLUDE_DOUBLE
	-D UNITY_DOUBLE_PRECISION=1e-9
lib_deps = bblanchon/ArduinoJson@^7.3.0
